<script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const SUPA_URL = "https://etijsguouvfpdtgofxqb.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0aWpzZ3VvdXZmcGR0Z29meHFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzU5NzEsImV4cCI6MjA5NTY1MTk3MX0.f90flRzvwWFAgp12KBn2sszYIOrcNRsxXOhxLkG4uMc";
const PROFILE  = "libroiva";
const DATA   = {"libro_iva": [], "libro_iva_resumen": [], "sync": []};     // solapas embebidas (chicas)
const REMOTE = {"libro_iva_detalle": {"resource": "v_detalle", "cols": ["company_nombre", "periodo", "fecha", "factura_numero", "tipo", "factura_origen_numero", "cliente_nombre", "cliente_cuit", "cliente_resp_afip", "cliente_actividades_afip", "ov_numero", "ov_fecha", "producto_codigo", "producto_nombre", "categoria_producto", "marca", "modelo", "condicion_lote", "actividad_afip_codigo", "actividad_afip_nombre", "cantidad", "neto", "iva_alicuota", "iva", "total_linea", "cuenta_contable_codigo", "cuenta_contable_nombre", "cuenta_analitica_nombre", "pct_analitico", "monto_analitico", "nro_serie_prov", "compra_series_prov_disponibles", "nro_serie", "entrega_fecha", "deposito_salida", "compra_oc_numero", "compra_oc_fecha", "compra_proveedor", "compra_proveedor_cuit", "compra_factura", "compra_factura_fecha", "compra_importe", "compra_importe_analitico", "compra_moneda", "recibido_fecha", "spread_ars", "spread_ars_analitico", "match_compra_por", "moneda", "tipo_cambio"], "filterCols": ["periodo", "factura_numero", "tipo", "cliente_nombre", "cliente_cuit", "ov_numero", "producto_codigo", "producto_nombre", "categoria_producto", "nro_serie", "compra_oc_numero", "compra_proveedor", "compra_factura"], "order": "fecha.desc.nullslast"}, "ventas": {"resource": "v_ventas", "cols": ["id", "company_nombre", "ov_numero", "ov_fecha", "cliente_nombre", "ov_moneda", "ov_importe_total", "factura_numero", "factura_fecha", "producto_codigo", "producto_nombre", "cantidad", "subtotal_con_iva", "cuenta_analitica_nombre", "monto_analitico", "nro_serie_prov", "nro_serie", "condicion_lote", "marca", "entrega_estado"], "filterCols": ["ov_numero", "cliente_nombre", "factura_numero", "producto_codigo", "producto_nombre", "nro_serie_prov", "nro_serie", "marca"], "order": "id.desc"}};   // config de solapas on-demand (pesadas)
const LABELS = {"libro_iva": "Libro IVA Ventas (por comprobante) (error)", "libro_iva_resumen": "Libro IVA — Resumen por período (error)", "sync": "Estado del sync (error)", "libro_iva_detalle": "Libro IVA — Detalle con trazabilidad", "ventas": "Ventas (todas las filas)"};
const tables = {};

function detectSorter(rows, col) {
  for (const r of rows) {
    if (r[col] == null) continue;
    if (typeof r[col] === "number") return "number";
    if (typeof r[col] === "string" && /^\d{4}-\d{2}-\d{2}/.test(r[col])) return "datetime";
    return "string";
  }
  return "string";
}

function fmtCell(cell) {
  const v = cell.getValue();
  if (typeof v === "number") {
    if (Number.isInteger(v)) return v.toLocaleString("es-AR");
    return v.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  return v;
}

// ---------- solapas embebidas ----------
function buildTable(key) {
  const rows = DATA[key];
  if (!rows || !rows.length) {
    document.getElementById("grid-" + key).innerHTML = "<div style='padding:24px;color:#888'>(Sin filas)</div>";
    return;
  }
  const cols = Object.keys(rows[0]).map(c => ({
    title: c, field: c, headerFilter: "input", resizable: true,
    sorter: detectSorter(rows, c), formatter: fmtCell,
  }));
  tables[key] = new Tabulator("#grid-" + key, {
    data: rows, columns: cols, layout: "fitDataStretch",
    pagination: true, paginationSize: 100,
    paginationSizeSelector: [25, 50, 100, 250, 500, true],
    height: "calc(100vh - 200px)", movableColumns: true, placeholder: "Sin datos",
  });
}

// ---------- solapas pesadas (PostgREST paginado en el server) ----------
function pgURLGenerator(cfg) {
  const base = SUPA_URL + "/rest/v1/" + cfg.resource;
  return function (url, config, params) {
    const qs = [];
    const size = params.size || 200;
    const page = params.page || 1;
    qs.push("limit=" + size);
    qs.push("offset=" + ((page - 1) * size));
    if (params.sort && params.sort.length) {
      qs.push("order=" + params.sort.map(s => s.field + "." + s.dir).join(","));
    } else {
      qs.push("order=" + cfg.order);
    }
    if (params.filter && params.filter.length) {
      params.filter.forEach(f => {
        if (f.value == null || f.value === "") return;
        qs.push(encodeURIComponent(f.field) + "=ilike.*" + encodeURIComponent(f.value) + "*");
      });
    }
    if (filtroEmpresaActivo) {
      qs.push("company_nombre=eq." + encodeURIComponent(filtroEmpresaActivo));
    }
    return base + "?" + qs.join("&");
  };
}

function buildRemoteTable(key) {
  const cfg = REMOTE[key];
  const colDefs = cfg.cols.map(c => {
    const d = { title: c, field: c, resizable: true, formatter: fmtCell };
    if (cfg.filterCols.includes(c)) { d.headerFilter = "input"; d.headerFilterLiveFilter = false; }
    return d;
  });
  tables[key] = new Tabulator("#grid-" + key, {
    columns: colDefs,
    layout: "fitData",
    height: "calc(100vh - 200px)",
    ajaxURL: SUPA_URL + "/rest/v1/" + cfg.resource,
    ajaxConfig: { method: "GET", headers: { apikey: SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY, "Accept-Profile": PROFILE } },
    ajaxURLGenerator: pgURLGenerator(cfg),
    ajaxResponse: function (url, params, response) { return response; },
    progressiveLoad: "scroll",
    progressiveLoadScrollMargin: 300,
    paginationSize: 200,
    sortMode: "remote",
    filterMode: "remote",
    movableColumns: true,
    placeholder: "Sin datos / cargando…",
  });
}

function showTab(key) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + key).classList.add("active");
  document.getElementById("btn-" + key).classList.add("active");
  if (!tables[key]) {
    if (REMOTE[key]) buildRemoteTable(key); else buildTable(key);
  }
}

// ---------- filtro global de empresa ----------
let filtroEmpresaActivo = null;

function _filtroEmpresaFn(data) {
  if (!filtroEmpresaActivo) return true;
  const keys = Object.keys(data).filter(k => k.toLowerCase().includes("company"));
  if (!keys.length) return true;
  return keys.some(k => data[k] === filtroEmpresaActivo);
}

function aplicarFiltroEmpresa() {
  const valor = document.getElementById("company-filter").value;
  filtroEmpresaActivo = valor || null;
  for (const key of Object.keys(tables)) {
    const tbl = tables[key];
    if (!tbl) continue;
    if (REMOTE[key]) {
      tbl.replaceData();  // refetch con el filtro de empresa aplicado en el server
    } else {
      tbl.removeFilter(_filtroEmpresaFn);
      if (filtroEmpresaActivo) tbl.addFilter(_filtroEmpresaFn);
    }
  }
}

// ---------- descargas ----------
function downloadXlsx(key) {
  if (tables[key]) tables[key].download("xlsx", "bricchi_" + key + ".xlsx", { sheetName: key });
}
function downloadCsv(key) {
  if (tables[key]) tables[key].download("csv", "bricchi_" + key + ".csv");
}

// Para las solapas pesadas: descarga TODO el filtro de empresa actual (loopea PostgREST).
async function descargarTodo(key) {
  const cfg = REMOTE[key];
  if (!confirm("Descargar TODAS las filas (filtro de empresa actual)? Puede tardar bastante.")) return;
  const base = SUPA_URL + "/rest/v1/" + cfg.resource;
  const size = 1000;
  let offset = 0, all = [], chunk;
  try {
    do {
      const qs = ["limit=" + size, "offset=" + offset, "order=" + cfg.order];
      if (filtroEmpresaActivo) qs.push("company_nombre=eq." + encodeURIComponent(filtroEmpresaActivo));
      const r = await fetch(base + "?" + qs.join("&"), { headers: { apikey: SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY, "Accept-Profile": PROFILE } });
      chunk = await r.json();
      if (!Array.isArray(chunk)) { alert("Error al descargar: " + JSON.stringify(chunk)); return; }
      all = all.concat(chunk);
      offset += size;
    } while (chunk.length === size);
    const ws = XLSX.utils.json_to_sheet(all);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, key);
    XLSX.writeFile(wb, "bricchi_" + key + "_completo.xlsx");
  } catch (e) {
    alert("Error al descargar todo: " + e);
  }
}

showTab("libro_iva");
</script>
</body>
